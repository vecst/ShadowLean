name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build (warnings as errors)
        run: lake build --wfail

      - name: Enforce project-wide axiom allowlist and test rejection
        shell: bash
        run: |
          set -euo pipefail
          lake env python3 audit/check_axioms.py --self-test | tee audit/allowlist.out

      - name: Readable named axiom report
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true audit/AxiomAudit.lean | tee audit/named-axioms.out

      - name: Preserve axiom audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: audit/*.out
          if-no-files-found: ignore
